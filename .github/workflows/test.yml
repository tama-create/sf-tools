name: テスト

# sf-tools 自体のテスト（モックベースの単体テスト。件数は変わるため、書かない）と、シェルの静的解析（shellcheck）。
# 実際の GitHub / Salesforce には触れない（Secrets は使わない）。実環境の確認は tests/e2e（開発者が手動で実行する）。
# shellcheck の設定（無効にしている項目と、その理由）は、リポジトリの .shellcheckrc。
on:
  pull_request:
    branches: [main, development]
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 全件テスト
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 結合テスト（test_integration.sh）は、別のジョブ（下の integration）で動かす
      SF_TEST_SKIP_INTEGRATION: "1"
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v4

      - name: テストを実行
        run: bash tests/run_tests.sh

  shellcheck:
    name: shellcheck（警告以上）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v4

      - name: Python を用意
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # バージョンを固定する（手元と同じ結果にするため）。設定は、リポジトリの .shellcheckrc
      - name: shellcheck を導入
        run: pip install shellcheck-py==0.11.0.1

      - name: shellcheck を実行（警告以上）
        run: |
          shellcheck --version
          files=$(git ls-files 'bin/*.sh' 'lib/*.sh' 'phases/*.sh' 'hooks/*' 'templates/*.sh')
          shellcheck -S warning $files

  # --------------------------------------------------------------------------
  # クロスプラットフォーム（macOS・Windows）。sf-tools は、Windows（Git Bash）・macOS・Linux で、同じように動くことが前提。
  # 2026-10-14: macOS・Windows とも、全件が成功するようになったため、失敗扱いにした（continue-on-error を外した）。
  # 以前は、導入の初期として、結果の表示のみ（continue-on-error: true）にしていた。
  # --------------------------------------------------------------------------
  test-macos:
    name: 全件テスト（macOS）
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      SF_TEST_SKIP_INTEGRATION: "1"   # 結合テストは、別のジョブ（integration）で動かす
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v4

      # macOS 標準の Bash（/bin/bash = 3.2）のまま実行する。sf-tools は、追加のインストールなしで、macOS で動くことが前提
      # （Bash 4 以降の機能を使うと、ここで失敗する）。sed などの標準コマンドも、BSD 版のまま使う（GNU 版は、入れない）
      - name: テストを実行（macOS 標準の Bash 3.2）
        run: |
          /bin/bash --version | head -1
          sed --version 2>&1 | head -1 || true
          /bin/bash tests/run_tests.sh

  test-windows:
    name: 全件テスト（Windows・Git Bash）
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # Git Bash のまま実行する（run_tests.sh は、WSL を使えるとき、WSL に移るが、ランナーには WSL のディストリビューションがない）
      SF_TEST_NO_WSL: "1"
      SF_TEST_SKIP_INTEGRATION: "1"   # 結合テストは、別のジョブ（integration）で動かす
      # 起動するテストファイルを順に表示する（異常終了したとき、どのファイルで止まったかを分かるようにする）
      SF_TEST_PROGRESS: "1"
    steps:
      # Windows では、チェックアウト時に、改行が CRLF に変換されることがある。シェルスクリプトは LF のままにする
      - name: 改行の自動変換を止める
        run: git config --global core.autocrlf false

      - name: ソースコードを取得
        uses: actions/checkout@v4

      # 並列（既定は CPU の数）で実行する。以前は、終了コード 2304 で異常終了していたが、原因は、並列ではなく、
      # テストが本物の `git update-git-for-windows`（Git の更新）を実行し、Git Bash 自体を壊していたことだった
      # （tests/run_tests.sh の保護用の代理コマンドで解消）。1 ファイルずつ（--serial）だと、約 30 分かかる。
      # 再び異常終了するときは、--serial に戻す（SF_TEST_PROGRESS の [START] 行で、止まったファイルが分かる）
      - name: テストを実行
        run: |
          bash --version | head -1
          bash tests/run_tests.sh

  # --------------------------------------------------------------------------
  # 結合テスト L1（ローカル結合）: 実際の git ＋ ローカルの bare リポジトリ ＋ gh・sf・npm の fake で、
  # 複数のコマンドを連動させる（tests/test_integration.sh。計画: doc/integration-test-plan.md）。
  # 全件テストとは別のジョブにして、3 つの OS で並行して動かす（Windows は、プロセスの起動が遅いため、シナリオと入力を絞る）。
  # --------------------------------------------------------------------------
  integration:
    name: 結合テスト L1（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: 改行の自動変換を止める
        run: git config --global core.autocrlf false

      - name: ソースコードを取得
        uses: actions/checkout@v4

      # macOS は、標準の Bash 3.2（/bin/bash）のまま実行する。Windows は Git Bash
      - name: 結合テストを実行（Windows 以外）
        if: runner.os != 'Windows'
        run: /bin/bash tests/test_integration.sh

      # Windows は、時間の予算のため、シナリオと入力を絞る（A13a と X6-1 の表と、X6-2 の n・EOF）
      - name: 結合テストを実行（Windows）
        if: runner.os == 'Windows'
        env:
          IT_SCENARIOS: "A13a X6_2 X6_1"
          IT_X62_QUICK: "1"
        run: bash tests/test_integration.sh
