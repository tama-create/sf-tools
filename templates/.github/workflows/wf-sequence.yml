# ==============================================================================
# wf-sequence.yml - Salesforce マージ順序チェック
# ==============================================================================
# main / staging への PR で、マージの順序（プロモーション順序）を確かめる。順序の定義は、sf-tools/config/branches.txt の並び
# （常に main のものを読む。上から main → staging → develop で、下に書いたブランチほど、前の段階）。
#   - 順序外（PR のソースブランチが、前の段階のブランチに、まだマージされていない）: 警告するだけで、マージは止めない
#     （緊急の Hotfix を妨げないため。ジョブ「順序チェック」は成功する）
#   - 環境ブランチ（branches.txt のブランチ）から直接出された PR: エラーで、ジョブ「順序チェック」を失敗させる
#   どちらも、PR の会話欄にコメントを投稿し（同じ PR では、既存のコメントを更新する）、Slack に通知する。
# 開発者が sf-next.sh を使う限り、順序は守られる。このチェックは、ランチャーを使わず、GitHub 上で直接 PR を作った場合に、
# レビュアーが気づけるようにするためのもの。気づいたレビュアーが、PR を却下する。
# Actions の画面での名前は「[sequence] マージ順序チェック」（最上位の name:）。
#
# 【起動の条件】
#   - pull_request（types の指定なし = opened / synchronize / reopened）で、マージ先が main または staging のとき
#   - 起動しない場合: develop など、main / staging 以外への PR。PR のタイトル・本文・マージ先の変更（edited）、
#     マージ・クローズ（closed）、ブランチへの直接の push、コンフリクトのある PR（GitHub がマージ結果を作れないため）。
#     workflow_dispatch（手動の実行）・schedule はない
#
# 【ジョブ】
#   1. 対象ファイル確認（check-branch）: 順序チェックが必要かを判定し、出力 skip（true / false）を返す。常に実行する
#   2. 順序チェック（check-promotion-order）: check-branch のあと（needs）。skip が true のときは、スキップされる
#   ブランチ保護との関係: ジョブ名「対象ファイル確認」「順序チェック」は、sf-init の Phase 9（phases/init/09_repo_rules.sh）が、
#   Ruleset protect-main / protect-staging（対象: main / staging）に登録する必須チェック 3 つのうちの 2 つ（もう 1 つは
#   wf-validate.yml の「デプロイ検証」。名前の正本は lib/project.sh の required_status_check_names）。ジョブ名（name:）を変えると、必須チェックが永久に満たされず、
#   PR をマージできなくなる。
#     - 必須チェックは、ジョブ名だけで照合される。main / staging への PR では、wf-validate.yml と、このワークフローの
#       「対象ファイル確認」が、同じ名前のチェックとして 2 つ並ぶ。この場合に、GitHub が、どちらの結果で（または両方で）
#       判定するかは、未確認
#     - 環境ブランチからの PR: 「順序チェック」が失敗するため、マージできない
#     - 順序外の PR: 「順序チェック」は成功するため、マージは止まらない（コメントと Slack で知らせるだけ）
#     - スキップされたジョブは、GitHub の仕様で、必須チェックとしては成功として扱われる
#     - Ruleset がない場合（作成に失敗した。無料プランの Private リポジトリなど）は、失敗しても、マージは止まらない。
#       リポジトリの Admin は、Ruleset をバイパスできる（bypass_mode: always）
#
# 【処理の流れ】
#   対象ファイル確認:
#     1. PR のマージ結果（pull_request の既定のチェックアウト）を取得する
#     2. origin の main を取得し（git fetch origin main --depth=1。失敗したら、::warning を出し、skip=false で終わる。
#        順序チェックが、自分で main を取得して、失敗するため）、main の
#        sf-tools/config/branches.txt から、環境ブランチの一覧を読む（# の行・空行を除く。branches.txt がない・ブランチの行が
#        ない場合は、環境ブランチなしとして、手順 3 へ進む）。ソースブランチが環境ブランチなら、skip=false で終わる
#        （環境ブランチには、通常、sf-tools/release/<ブランチ名>/ がなく、手順 3 でスキップされて、素通りになるため）
#     3. sf-tools/release/<ソースブランチ名>/ の deploy-target.txt・remove-target.txt に、実質的な行（# の行・空行・
#        [files]・[members] 以外）があるかを確認する。どちらにもなければ skip=true（スキップの旨を表示）、あれば skip=false
#   順序チェック:
#     1. 全履歴（fetch-depth: 0）で、PR のマージ結果を取得する
#     2. マージ順序を検証する（ステップ「マージ順序を検証」。id: sequence_check）
#        a. origin の main を取得し（git fetch origin main。失敗すると、ジョブが失敗する）、main の
#           sf-tools/config/branches.txt を読む。ない場合は、::notice を出して、成功で終わる（何も通知しない）
#        b. ソースブランチが環境ブランチなら、::error を出して、終了コード 1 で失敗する（出力 env_branch=true）
#        c. マージ先が branches.txt にない場合（branches.txt にブランチの行が 1 つもない場合を含む）は、::notice を出して、
#           成功で終わる（何も通知しない）
#        d. branches.txt で、マージ先より下に書かれたブランチ（前の段階）を、すべて調べる。前の段階がなければ、
#           出力 out_of_order=false で、成功で終わる
#        e. 前の段階の各ブランチを git fetch し、git merge-base --is-ancestor で、PR のソースの最新のコミット
#           （pull_request.head.sha。フォークからの PR でも調べられるよう、ブランチ名ではなく、コミットで調べる）が
#           origin/<前の段階> に含まれるかを確かめる。含まれないブランチは、::warning を出し、一覧（出力 prev）に加える。
#           1 つでもあれば out_of_order=true、なければ out_of_order=false。どちらも、このステップは成功する
#     3. （順序外・環境ブランチのとき。前のステップが失敗しても実行する）Slack の chat.postMessage に、通知を送る
#        （Secret SLACK_BOT_TOKEN・Variable SLACK_CHANNEL_ID）。送信に失敗した（curl の失敗・応答の ok が true でない）ときは、
#        ::warning を出す（このステップは失敗にしない。応答の JSON は、ランナーの node で読む）
#     4. （out_of_order が出力されたとき・環境ブランチのとき。前のステップが失敗しても実行する）PR の会話欄にコメントする。
#        目印（<!-- sf-tools:sequence -->）のある既存のコメントがあれば、更新する。なければ、新しく投稿する。
#        内容は、環境ブランチ → 「⛔ 環境ブランチからの PR は、許可されていません」、順序外 → 「⚠️ マージ順序の確認が必要です」、
#        順序どおり → 「✅ マージ順序は、問題ありません」（ただし、順序どおりで、既存のコメントがない場合は、何も投稿しない）
#
# 【必要な Secrets / Variables】
#   Secrets（このリポジトリに設定する。sf-init の Phase 7 が登録する）:
#     SLACK_BOT_TOKEN  : Slack API の Bot Token（順序外・環境ブランチからの PR の通知に使用）
#   Variables（このリポジトリに設定する。sf-init の Phase 7 が登録する）:
#     SLACK_CHANNEL_ID : 通知先 Slack チャンネル ID
#   このほか、PR へのコメントに、自動の GITHUB_TOKEN を使う（設定不要。permissions: pull-requests: write）
#
# 【補足】
#   - branches.txt は、PR のマージ結果ではなく、常に origin の main から読む（PR のマージ結果には、含まれない場合があるため）
#   - run は bash -e で動く（GitHub Actions の既定。pipefail は付かない）。チェックアウト以外で、ジョブが失敗するのは、次の場合だけ:
#     順序チェックの手順 2a の git fetch origin main の失敗（環境ブランチかを判定できないまま、素通りさせないため。
#     対象ファイル確認の手順 2 の同じ失敗は、ジョブを失敗にせず、skip=false で順序チェックに任せる）、順序チェックの手順 2b（環境ブランチからの PR）、手順 2e の git fetch の失敗（branches.txt にある
#     ブランチが origin にない）、手順 4 のコメントの失敗。branches.txt がない・ブランチの行がない場合は、失敗にしない
#   - フォークからの PR: 順序の判定（手順 2）は行える。ただし、GitHub の既定の設定では、Secrets が渡されず、GITHUB_TOKEN が
#     読み取り専用になるため、Slack の通知（手順 3）は ::warning で終わり、PR へのコメント（手順 4）は失敗する
#   - Salesforce の組織には、接続しない
# ==============================================================================
name: "[sequence] マージ順序チェック"
on:
  pull_request:
    branches:
      - main
      - staging

jobs:
  check-branch:
    name: 対象ファイル確認
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - id: check
        name: デプロイ対象ファイルを確認
        env:
          # ブランチ名・PR のタイトルなど、利用者が決められる値は、シェルのスクリプトに直接埋め込まず、環境変数で受け取る
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          HEAD="$HEAD_REF"
          DEPLOY="sf-tools/release/${HEAD}/deploy-target.txt"
          REMOVE="sf-tools/release/${HEAD}/remove-target.txt"
          has_content() {
            [[ -f "$1" ]] && grep -qvE '^\s*(#|$|\[files\]|\[members\])' "$1"
          }
          # 環境ブランチ（branches.txt のブランチ）から直接出された PR は、デプロイ対象がなくても、必ず、順序チェックを行う。
          #   環境ブランチには、通常、sf-tools/release/<ブランチ名>/ がなく、下の判定でスキップされて、素通りになるため。
          #   branches.txt は、main から読む（PR のマージ結果には、含まれない場合があるため）
          # main の取得（git fetch）に失敗したら、環境ブランチかを判定できない。スキップで素通りさせないよう、skip=false で終える
          #   （このジョブを失敗にはしない。順序チェックが、自分で main を取得して、失敗にするため。このジョブの失敗は、
          #   同じ名前のチェックが成功しているコミットでは、マージを止められない恐れがある）
          if ! git fetch origin main --depth=1 -q; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::warning::main を取得できませんでした。環境ブランチかを判定できないため、順序チェックを実行します。"
            exit 0
          fi
          # main に branches.txt がない・ブランチの行が 1 つもない場合は、環境ブランチなしとして続ける。
          #   run は bash -e で動き、pipefail は付かないため、パイプの途中の git show・grep の失敗（該当なし）では止まらない。
          #   || true は、-eo pipefail で動かしても止まらないための保険（tests/test_wf-sequence.sh は、-eo pipefail で確かめる）
          ENV_BRANCHES=$(git show FETCH_HEAD:sf-tools/config/branches.txt 2>/dev/null | grep -v '^[[:space:]]*#' | grep -v '^[[:space:]]*$' | tr -d '\r' || true)
          if echo "$ENV_BRANCHES" | grep -qxF -- "$HEAD"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "環境ブランチ（${HEAD}）からの PR のため、デプロイ対象がなくても、順序チェックを実行します。"
            exit 0
          fi
          if ! has_content "$DEPLOY" && ! has_content "$REMOVE"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "デプロイ対象なし（${DEPLOY} / ${REMOVE} に内容なし）のためスキップします。"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  check-promotion-order:
    name: 順序チェック
    needs: check-branch
    if: needs.check-branch.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # 順序外の警告を、PR の会話欄に投稿するため

    steps:
      # --------------------------------------------------------------------------
      # Step 1: 全履歴付きでリポジトリをチェックアウト
      # --------------------------------------------------------------------------
      - name: ソースコードを取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------------------------------
      # Step 2: マージ順序の検証
      # --------------------------------------------------------------------------
      - name: マージ順序を検証
        id: sequence_check
        env:
          FEATURE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.ref_name }}
          # PR のソースの最新のコミット（順序の判定に使う。ブランチ名ではなく、コミットで調べる理由は、下の判定の箇所を参照）
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          FEATURE="$FEATURE_REF"
          BASE="$BASE_REF"

          # branches.txt は常に main ブランチから読み込む（main の取得（git fetch）の失敗は、ジョブの失敗にする）
          BRANCH_FILE=$(mktemp)
          trap 'rm -f "$BRANCH_FILE"' EXIT
          git fetch origin main -q
          if ! git show origin/main:sf-tools/config/branches.txt > "$BRANCH_FILE" 2>/dev/null; then
            echo "::notice::branches.txt が見つかりません。チェックをスキップします。"
            exit 0
          fi

          # コメントと空行を除外してブランチ一覧を取得（ブランチの行が 1 つもないときは、空。
          #   run は bash -e で動き、pipefail は付かないため、パイプの途中の grep の失敗（該当なし）では止まらない。
          #   || true は、-eo pipefail で動かしても止まらないための保険（tests/test_wf-sequence.sh は、-eo pipefail で確かめる）。
          #   空のときは、下の「マージ先が branches.txt にない」で、成功で終わる）
          BRANCHES=$(grep -v '^[[:space:]]*#' "$BRANCH_FILE" | grep -v '^[[:space:]]*$' | tr -d '\r' || true)

          # 環境ブランチ（branches.txt のブランチ）からの PR は、エラーで失敗させる（必須チェック「順序チェック」が失敗する）
          if echo "$BRANCHES" | grep -qxF -- "$FEATURE"; then
            echo "env_branch=true" >> "$GITHUB_OUTPUT"
            echo "feature=${FEATURE}" >> "$GITHUB_OUTPUT"
            echo "::error title=マージ元ブランチ不正::${FEATURE} からのPRは許可されていません。必ずフィーチャーブランチからPRを作成してください。"
            exit 1
          fi

          # base_ref が branches.txt に含まれていない場合はスキップ（成功で終わる。出力なしのため、通知・コメントもしない）
          if ! echo "$BRANCHES" | grep -qxF -- "$BASE"; then
            echo "::notice::チェック対象外のブランチです: $BASE"
            exit 0
          fi

          # base_ref より下位のブランチ（前段ブランチ。branches.txt で base_ref より下に書かれたブランチ）を取得
          PREV_LIST=""
          FOUND=false
          while IFS= read -r line; do
            line=$(echo "$line" | tr -d '\r')
            echo "$line" | grep -q '^[[:space:]]*#' && continue
            [ -z "$(echo "$line" | tr -d '[:space:]')" ] && continue
            if [ "$FOUND" = true ]; then
              PREV_LIST="${PREV_LIST:+$PREV_LIST }$line"
            fi
            [ "$line" = "$BASE" ] && FOUND=true
          done < "$BRANCH_FILE"

          # 前段ブランチがない場合（最下位ブランチ or main のみ構成）
          if [ -z "$PREV_LIST" ]; then
            echo "::notice title=チェック完了::${BASE} への PR に前段ブランチの確認は不要です"
            echo "out_of_order=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # PR のソースのコミット（head.sha）が、前の段階のブランチに含まれるかを調べる。
          #   origin/<ソースブランチ> ではなく、コミットで調べるのは、フォークからの PR では、ソースブランチがフォーク側の
          #   リポジトリにあり、origin/<ソースブランチ> がないため（コミットは、PR のマージ結果の親として、全履歴の取得に含まれる）。
          #   前の段階のブランチが origin にないと、git fetch が失敗し、ジョブが失敗する
          MISSING=""
          for PREV in $PREV_LIST; do
            git fetch -q origin "$PREV"
            if git merge-base --is-ancestor "$HEAD_SHA" "origin/$PREV"; then
              echo "::notice title=プロモーション順序OK::✓ ${FEATURE} は ${PREV} にマージ済みです"
            else
              echo "::warning title=⚠ プロモーション順序未確認::${FEATURE} は ${PREV} にまだマージされていません。意図的な場合はそのまま進めてください。"
              MISSING="${MISSING:+$MISSING, }${PREV}"
            fi
          done

          if [ -z "$MISSING" ]; then
            echo "out_of_order=false" >> "$GITHUB_OUTPUT"
          else
            echo "out_of_order=true"  >> "$GITHUB_OUTPUT"
            echo "feature=${FEATURE}" >> "$GITHUB_OUTPUT"
            echo "prev=${MISSING}"    >> "$GITHUB_OUTPUT"
          fi

      # --------------------------------------------------------------------------
      # Step 3: 順序未確認時・環境ブランチからの PR のときの Slack 通知（前のステップが失敗しても実行する。
      #   送信の失敗は ::warning にし、このステップは失敗にしない）
      # --------------------------------------------------------------------------
      - name: Slack に順序未確認を通知
        if: always() && (steps.sequence_check.outputs.out_of_order == 'true' || steps.sequence_check.outputs.env_branch == 'true')
        env:
          ENV_BRANCH: ${{ steps.sequence_check.outputs.env_branch }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          # ブランチ名・PR のタイトルは、シェルのスクリプトに直接埋め込まず、環境変数で受け取る
          FEATURE_RAW: ${{ steps.sequence_check.outputs.feature }}
          PREV_RAW: ${{ steps.sequence_check.outputs.prev }}
          PR_TITLE_RAW: ${{ github.event.pull_request.title || '' }}
          PR_NUMBER_RAW: ${{ github.event.pull_request.number || '' }}
          PR_URL_RAW: ${{ github.event.pull_request.html_url || '' }}
          BASE_RAW: ${{ github.event.pull_request.base.ref || github.ref_name }}
        run: |
          # Slack に送る JSON の文字列として安全にする（" と \ のエスケープ・制御文字の除去・Slack の特殊文字 & < > の置き換え）
          json_escape() { printf '%s' "$1" | tr -d '\000-\037' | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
          FEATURE=$(json_escape "$FEATURE_RAW")
          PREV=$(json_escape "$PREV_RAW")
          PR_TITLE=$(json_escape "$PR_TITLE_RAW")
          PR_NUMBER=$(json_escape "$PR_NUMBER_RAW")
          PR_URL=$(json_escape "$PR_URL_RAW")
          BASE=$(json_escape "$BASE_RAW")
          DATETIME=$(TZ='Asia/Tokyo' date '+%Y-%m-%d %H:%M:%S JST')

          if [ "$ENV_BRANCH" = "true" ]; then
            MESSAGE=":no_entry: *環境ブランチからの PR は許可されていません*\n• ブランチ \`${FEATURE}\` は、環境ブランチです\n• PR: <${PR_URL}|#${PR_NUMBER} ${PR_TITLE}>\n• 対象: \`${FEATURE}\` → \`${BASE}\`\n• 実行日時: ${DATETIME}\n• この PR は却下し、feature ブランチから作り直してください"
          else
            MESSAGE=":warning: *マージ順序の確認が必要です*\n• ブランチ \`${FEATURE}\` は \`${PREV}\` にまだマージされていません\n• PR: <${PR_URL}|#${PR_NUMBER} ${PR_TITLE}>\n• 対象: \`${FEATURE}\` → \`${BASE}\`\n• 実行日時: ${DATETIME}\n• 意図的でなければ、この PR は却下してください"
          fi
          PAYLOAD="{\"channel\": \"${SLACK_CHANNEL_ID}\", \"text\": \"${MESSAGE}\"}"

          # 送信の失敗（curl の失敗・応答の ok が true でない（Token の誤り・Bot がチャンネルにいないなど））は、::warning を出すだけで、
          #   このステップは失敗にしない。応答の JSON は、Node で読む（ランナーに入っている node を使う）
          RESPONSE=$(curl -sS -X POST "https://slack.com/api/chat.postMessage" \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || true)   # 意図的なエラー無視（下で応答を確かめ、::warning にする）
          echo "Slack の応答: $RESPONSE"
          if ! node -e 'process.exit(JSON.parse(process.argv[1]).ok === true ? 0 : 1)' "$RESPONSE" 2>/dev/null; then
            echo "::warning title=Slack 通知の失敗::Slack への通知が、失敗しました（応答の ok が true ではありません）。Secret SLACK_BOT_TOKEN・Variable SLACK_CHANNEL_ID を確認してください。"
          fi

      # --------------------------------------------------------------------------
      # Step 4: 順序外・環境ブランチからの PR の警告を、PR の会話欄に投稿する（レビュアーが、気づけるように）
      #   同じ PR では、既存のコメント（目印: sf-tools:sequence）を更新する（順序どおりになったら「✅」に書き換える）。
      #   順序どおりで、以前の警告もない場合は、何も投稿しない
      # --------------------------------------------------------------------------
      - name: 順序の結果を PR に投稿
        if: always() && github.event_name == 'pull_request' && (steps.sequence_check.outputs.out_of_order != '' || steps.sequence_check.outputs.env_branch == 'true')
        uses: actions/github-script@v7
        env:
          # ブランチ名などは、JavaScript のソースに直接埋め込まず、環境変数で受け取る
          ENV_BRANCH: ${{ steps.sequence_check.outputs.env_branch }}
          OUT_OF_ORDER: ${{ steps.sequence_check.outputs.out_of_order }}
          FEATURE: ${{ steps.sequence_check.outputs.feature }}
          PREV: ${{ steps.sequence_check.outputs.prev }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        with:
          script: |
            const 目印 = '<!-- sf-tools:sequence -->';
            const 順序外 = process.env.OUT_OF_ORDER === 'true';
            const 環境ブランチ = process.env.ENV_BRANCH === 'true';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const コメント一覧 = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const 既存 = コメント一覧.find((c) => c.body && c.body.includes(目印));
            if (!順序外 && !環境ブランチ && !既存) return;
            let 本文;
            if (環境ブランチ) {
              本文 = [
                目印,
                '## ⛔ 環境ブランチからの PR は、許可されていません',
                '',
                `\`${process.env.FEATURE}\` は、環境ブランチ（\`branches.txt\` に記載のブランチ）です。\`${process.env.BASE_REF}\` への PR は、feature ブランチから作成してください。`,
                '',
                '**この PR は却下し、feature ブランチから作り直してください。**（通常は、`sf-next.sh` が示す順序で、PR を出します）',
              ].join('\n');
            } else if (順序外) {
              本文 = [
                目印,
                '## ⚠️ マージ順序の確認が必要です',
                '',
                `ブランチ \`${process.env.FEATURE}\` は、\`${process.env.PREV}\` にまだマージされていません。`,
                `このまま \`${process.env.BASE_REF}\` にマージすると、段階を飛び越すことになります。`,
                '',
                '**意図的でなければ、この PR は却下してください。**（通常は、`sf-next.sh` が示す順序で、PR を出します）',
              ].join('\n');
            } else {
              本文 = [目印, '## ✅ マージ順序は、問題ありません', '', '前の段階へのマージを、確認しました。'].join('\n');
            }
            if (既存) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: 既存.id, body: 本文 });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: 本文 });
            }
