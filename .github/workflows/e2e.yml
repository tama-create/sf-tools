name: e2e（実環境の通し検証）

# 実際の GitHub / Salesforce で sf-init の通し検証（tests/e2e/run.sh）を動かす。テスト用の組織・リポジトリを使い、作ったものは、名前の形式と
# オーナーが一致するものだけを削除する（tests/e2e/lib.sh の安全ガード。Actions 上でも、同じ）。
#
# 【動かし方】
#   ・Windows（Git Bash）で、全部（sf-init・wf-metasync・Hello World のリリースと削除・--add-tier）を確認する。
#     サーバー側（Actions のワークフロー）は、クライアントの OS に関係なく、いつも GitHub の Linux 上で動くため、この 1 回で足りる。
#     Windows の最後に、残ったテスト用リポジトリに対して、実環境のシナリオ（tests/e2e/scenario.sh。dist-main を除く）も動かす。
#   ・続けて、macOS（標準の Bash 3.2）で、クライアント側だけ（--no-actions --no-add-tier）を確認する。
#   ・同じテスト用の組織を使うため、2 つのジョブは一列に動かす（Windows → macOS。ワークフローの実行どうしも、concurrency で一列）。
#
# 【いつ動くか】
#   ・配布物（bin/ lib/ phases/ hooks/ templates/ config/）または e2e 自体（tests/e2e/・このファイル）が変わった development への push。
#     rr のときには、すでに緑になっている（ドキュメント・単体テストだけの変更では、動かさない）。
#   ・週 1 回（月曜 03:00 日本時間。schedule。main に対して）。
#   ・手動（workflow_dispatch。main に取り込まれたあとで、Actions の画面・gh workflow run から。
#     手動実行のワークフローは、既定のブランチ（main）にあるものだけが、起動できる）。
#
# 【必要な設定】（リポジトリの Settings → Environments → e2e。doc/integration-test-plan.md 12.5）
#   ・Environment `e2e`（Deployment branches は、development と main だけ）
#   ・Secrets（e2e の Environment に登録。値は、ログで伏せられる。sf-tools は公開リポジトリのため、すべて Secrets にする）
#       E2E_GH_TOKEN         テスト用の組織の管理者の Classic PAT（スコープ: repo / workflow / admin:org / delete_repo）。gh が使う
#       E2E_PAT_TOKEN        テスト用リポジトリの PAT_TOKEN に登録する Classic PAT
#       E2E_SLACK_BOT_TOKEN  Slack の Bot Token
#       E2E_SFDX_AUTH_URL / E2E_SFDX_AUTH_URL_STG / E2E_SFDX_AUTH_URL_DEV   main / staging / develop のテスト用組織の認証 URL
#       E2E_OWNER            テスト用リポジトリのオーナー（組織名）
#       E2E_GH_USER          E2E_GH_TOKEN のユーザー名（gh のログインユーザー）
#       E2E_SLACK_CHANNEL_ID 通知先のチャンネル ID
#
# 【注意】 sf-tools は公開リポジトリのため、このワークフローのログは誰でも読める。Secret の値は、GitHub が伏せ、e2e も、画面とログに出す前に
# 伏せる（_e2e_mask_line）。組織の ID・ユーザー名・My Domain の URL は、Secret に登録した値ではないため、tests/e2e/ci-mask.sh が、
# e2e の実行の前に調べて、「::add-mask::」で伏せる。組織の ID・ユーザー名・メールアドレスなどを、画面に出す処理を足すときは、これが効くか確認すること。
on:
  workflow_dispatch:
  # 週 1 回、main（利用者が実際に受け取るもの）に対して動かす。コードを変えていない間の、外側の変化
  # （sf の新しい版・Salesforce のリリース・Actions のイメージの更新・認証の期限切れ）の見張り。
  # 毎週月曜 03:00（日本時間）。schedule は、既定のブランチ（main）のワークフローで動く。失敗したら Slack に通知する（下の notify）
  schedule:
    - cron: '0 18 * * 0'
  push:
    branches: [development]
    paths:
      - 'bin/**'
      - 'lib/**'
      - 'phases/**'
      - 'hooks/**'
      - 'templates/**'
      - 'config/**'
      - 'tests/e2e/**'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

# 同じテスト用の組織を使うため、ワークフローの実行どうしも、一列に動かす（実行中のものは、止めない）
concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  windows:
    name: e2e（Windows・全部）
    runs-on: windows-latest
    timeout-minutes: 120
    environment: e2e
    defaults:
      run:
        shell: bash
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v4

      - name: 開発者の環境に近づける（~/sf-tools・git の名前・gh の認証・sf）
        env:
          GH_TOKEN: ${{ secrets.E2E_GH_TOKEN }}
          E2E_GH_USER: ${{ secrets.E2E_GH_USER }}
        run: |
          # クライアント PC と同じく、~/sf-tools に sf-tools を置く（git の履歴つき。e2e が、origin/development との一致を確認する）
          cp -a "$(pwd)" "$HOME/sf-tools"
          git config --global user.name "$E2E_GH_USER"
          git config --global user.email "${E2E_GH_USER}@users.noreply.github.com"
          gh auth setup-git
          # sf は npm 版が前提（Windows の Git Bash では、公式インストーラー版は非対応）
          npm install -g @salesforce/cli
          # sf-init の Phase 4（sf-install.sh）は、24 時間以内に更新していなければ、sf-upgrade.sh（npm install -g など）を、バックグラウンドで起動する。
          # 使い捨てのサーバーは、毎回「初回」になり、e2e の実行中に sf が入れ替わって、fetch failed や command not found が起きる。
          # クライアント PC の 2 回目以降と同じく、更新済みの印（スタンプ）を、先に置く
          touch "$HOME/.sf-tools-last-update"
          bash --version | head -1
          sf --version

      - name: 鍵一式（fixture.env）を作る
        env:
          E2E_OWNER: ${{ secrets.E2E_OWNER }}
          E2E_GH_USER: ${{ secrets.E2E_GH_USER }}
          E2E_SLACK_CHANNEL_ID: ${{ secrets.E2E_SLACK_CHANNEL_ID }}
          E2E_PAT_TOKEN: ${{ secrets.E2E_PAT_TOKEN }}
          E2E_SLACK_BOT_TOKEN: ${{ secrets.E2E_SLACK_BOT_TOKEN }}
          E2E_SFDX_AUTH_URL: ${{ secrets.E2E_SFDX_AUTH_URL }}
          E2E_SFDX_AUTH_URL_STG: ${{ secrets.E2E_SFDX_AUTH_URL_STG }}
          E2E_SFDX_AUTH_URL_DEV: ${{ secrets.E2E_SFDX_AUTH_URL_DEV }}
        run: bash "$HOME/sf-tools/tests/e2e/ci-fixture.sh"

      # 組織の ID・ユーザー名・My Domain の URL を、公開ログに出さないよう、先に伏せる（以降のログで ***）
      - name: ログに出さない値を伏せる（組織の ID・ユーザー名・URL）
        env:
          E2E_SFDX_AUTH_URL: ${{ secrets.E2E_SFDX_AUTH_URL }}
          E2E_SFDX_AUTH_URL_STG: ${{ secrets.E2E_SFDX_AUTH_URL_STG }}
          E2E_SFDX_AUTH_URL_DEV: ${{ secrets.E2E_SFDX_AUTH_URL_DEV }}
        run: bash "$HOME/sf-tools/tests/e2e/ci-mask.sh"

      - name: e2e を実行（全部）
        env:
          GH_TOKEN: ${{ secrets.E2E_GH_TOKEN }}
          E2E_ALLOW_ACTIONS: "1"
          SF_LOG_LEVEL: debug   # 失敗したとき、原因（fetch failed の cause など）を、sf のログから取れるようにする
        run: |
          # 「続行しますか？」の確認に Y を答える（管理者が実際に行う操作と同じ流れ）
          printf 'Y\n' | bash "$HOME/sf-tools/tests/e2e/run.sh"

      # run.sh が残したテスト用リポジトリ（--add-tier で staging まである）に対して、実環境のシナリオ（L2）を動かす。
      # dist-main（配布版の確認）は、「rr の直後だけ」の条件があるため、ここでは動かさない
      - name: e2e のシナリオを実行（実環境の L2）
        env:
          GH_TOKEN: ${{ secrets.E2E_GH_TOKEN }}
          E2E_ALLOW_ACTIONS: "1"
        run: |
          bash "$HOME/sf-tools/tests/e2e/scenario.sh" -y log-secrets manual-delete update-secret sync-wf validate-fail metasync-diff propagate-fail restart-org

      # 失敗したときだけ、sf のログから、通信の失敗の原因の部分を抜き出す。
      # ログは公開されるため、組織の ID・URL・トークン・メールアドレスは伏せ、1 行 240 文字までにする
      - name: sf のログ（失敗の原因の抜粋）
        if: failure()
        run: |
          cat "$HOME"/.sf/sf-*.log 2>/dev/null \
              | grep -iE 'fetch failed|ECONN|ENOTFOUND|ETIMEDOUT|EAI_AGAIN|UND_ERR|socket|certificate|"cause"|SELF_SIGNED|ERR_' \
              | sed -E 's/00D[A-Za-z0-9]{12,15}![A-Za-z0-9._-]+/<token>/g; s/00D[A-Za-z0-9]{12,15}/00D***/g; s#https?://[A-Za-z0-9.-]+\.salesforce\.com#https://<host>.salesforce.com#g; s/Bearer [A-Za-z0-9._!-]+/Bearer <token>/g; s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/<mail>/g' \
              | cut -c1-240 | tail -40 || true

  macos:
    name: e2e（macOS・クライアント側のみ）
    needs: windows
    runs-on: macos-latest
    timeout-minutes: 90
    environment: e2e
    # macOS 標準の Bash 3.2 で動かす（Homebrew の Bash 5 ではなく）
    defaults:
      run:
        shell: /bin/bash -e {0}
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v4

      - name: 開発者の環境に近づける（~/sf-tools・git の名前・gh の認証・sf・Bash 3.2）
        env:
          GH_TOKEN: ${{ secrets.E2E_GH_TOKEN }}
          E2E_GH_USER: ${{ secrets.E2E_GH_USER }}
        run: |
          cp -a "$(pwd)" "$HOME/sf-tools"
          git config --global user.name "$E2E_GH_USER"
          git config --global user.email "${E2E_GH_USER}@users.noreply.github.com"
          gh auth setup-git
          npm install -g @salesforce/cli
          # 更新済みの印（スタンプ）を先に置く（理由は、Windows のジョブの同じ手順を参照。バックグラウンドの更新で sf が入れ替わるのを防ぐ）
          touch "$HOME/.sf-tools-last-update"
          # 以降の手順で、`bash` が、標準の /bin/bash（3.2）になるように、/bin を PATH の先頭に置く
          echo "/bin" >> "$GITHUB_PATH"
          /bin/bash --version | head -1
          sf --version

      - name: 鍵一式（fixture.env）を作る
        env:
          E2E_OWNER: ${{ secrets.E2E_OWNER }}
          E2E_GH_USER: ${{ secrets.E2E_GH_USER }}
          E2E_SLACK_CHANNEL_ID: ${{ secrets.E2E_SLACK_CHANNEL_ID }}
          E2E_PAT_TOKEN: ${{ secrets.E2E_PAT_TOKEN }}
          E2E_SLACK_BOT_TOKEN: ${{ secrets.E2E_SLACK_BOT_TOKEN }}
          E2E_SFDX_AUTH_URL: ${{ secrets.E2E_SFDX_AUTH_URL }}
          E2E_SFDX_AUTH_URL_STG: ${{ secrets.E2E_SFDX_AUTH_URL_STG }}
          E2E_SFDX_AUTH_URL_DEV: ${{ secrets.E2E_SFDX_AUTH_URL_DEV }}
        run: /bin/bash "$HOME/sf-tools/tests/e2e/ci-fixture.sh"

      - name: ログに出さない値を伏せる（組織の ID・ユーザー名・URL）
        env:
          E2E_SFDX_AUTH_URL: ${{ secrets.E2E_SFDX_AUTH_URL }}
          E2E_SFDX_AUTH_URL_STG: ${{ secrets.E2E_SFDX_AUTH_URL_STG }}
          E2E_SFDX_AUTH_URL_DEV: ${{ secrets.E2E_SFDX_AUTH_URL_DEV }}
        run: /bin/bash "$HOME/sf-tools/tests/e2e/ci-mask.sh"

      # クライアント側だけ（サーバー側は、Windows の 1 回で確認済み）。終わりに、作ったものを削除する
      - name: e2e を実行（クライアント側のみ）
        env:
          GH_TOKEN: ${{ secrets.E2E_GH_TOKEN }}
          E2E_ALLOW_ACTIONS: "1"
        run: |
          printf 'Y\n' | /bin/bash "$HOME/sf-tools/tests/e2e/run.sh" --no-actions --no-add-tier --cleanup

  # どちらかのジョブが失敗したら、Slack に通知する（push・定期・手動のどれでも）。値は、実行の URL・ブランチ・コミットだけ
  notify:
    name: 失敗の通知（Slack）
    needs: [windows, macos]
    if: ${{ always() && (needs.windows.result == 'failure' || needs.macos.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: e2e
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v4

      - name: Slack に通知
        env:
          SLACK_BOT_TOKEN: ${{ secrets.E2E_SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.E2E_SLACK_CHANNEL_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: bash tests/e2e/ci-notify.sh
