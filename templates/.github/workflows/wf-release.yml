# ==============================================================================
# wf-release.yml - Salesforce リリース
# ==============================================================================
# PR が main / staging / develop にマージされたら、マージ先のブランチに対応する Salesforce 組織へ、sf-release.sh --release で
# リリースし（組織に反映する）、結果を Slack に通知する。Actions の画面での名前は「[release] デプロイ」（最上位の name:）。
#
# 【起動の条件】
#   - pull_request の closed で、マージ先が main / staging / develop のとき（マージせずに閉じた PR でも起動するが、
#     ジョブ「リリース実行」はスキップされる）
#   - 手動の実行（workflow_dispatch）は、ない（PR を通らずに組織へ出せるため。doc/one-way-promotion-design.md 3.5）。
#     失敗したリリースのやり直しは、その実行の「Re-run jobs」で行う
#   - 起動しない場合: PR の作成・更新（opened / synchronize など）、上記以外のブランチへのマージ、ブランチへの直接の push
#     （sf-metasync.sh による main への push を含む）。schedule はない
#
# 【ジョブ】
#   1. リリース対象確認（check-branch）: デプロイ対象があるかを判定し、出力 skip（true / false）を返す。常に実行する
#   2. リリース実行（release）: check-branch のあと（needs）。PR がマージされ、かつ、skip が true でないときだけ実行する
#      （それ以外は、スキップされる）。権限: contents: read・pull-requests: read・statuses: write・actions: read（一方通行の確認と、リリースの印）。
#      同時実行の制御（concurrency）: グループは、マージ先のブランチごと（release-<ブランチ名>）。同じグループの実行は、
#      1 つずつ動く。実行中のものは取り消さず（cancel-in-progress: false）、待機中のものも、すべて残す（queue: max。最大 100）
#   ブランチ保護との関係: どちらのジョブも、必須チェックではない（PR を閉じたあとに動くため、マージの可否に関係しない）。
#   ジョブ名「リリース対象確認」は、wf-validate.yml・wf-sequence.yml の必須チェック「対象ファイル確認」と、わざと、別の名前にしてある
#   （PR のソースの最新のコミットには、チェックの結果が付く。同じ名前だと、先の PR のマージで付いた成功が、同じコミットの
#   次の段階の PR の必須チェックを、満たしてしまう恐れがあるため）
#
# 【処理の流れ】
#   リリース対象確認:
#     1. イベントの既定のコミットを取得する
#     1.5 リリース先（PR のマージ先）が main 以外なら、段階として有効かを確かめる
#        （origin/main の sf-tools/config/branches.txt。develop は staging もあるときだけ有効。doc/tier-scaling-design.md 3.3）。
#        無効なら skip=true（::notice。ジョブ「リリース実行」は動かない）。
#        main を取得できなければ、::error を出して、このジョブを失敗にする（「リリース実行」は needs のため動かない）。
#        branches.txt がなければ、::warning を出し、今までの動き（判定しない）にする
#     2. sf-tools/release/<ソースブランチ名>/ の deploy-target.txt・remove-target.txt に、実質的な行（# の行・空行・
#        [files]・[members] 以外）があるかを確認する。どちらにもなければ skip=true（スキップの旨を表示）、あれば skip=false
#   リリース実行（番号は、本体のコメントの Step の番号と同じ）:
#     1. リリース先（main → 🚀 main の組織 (prod)、staging → 🧪 staging の組織 (staging)、develop → 🔧 develop の組織 (develop)）を、
#        ::notice と、Actions の Summary（リリース先・ブランチ・PR 番号とタイトル（PR のときだけ）・実行日時（日本時間））に書く
#     2. この PR のマージのコミット（pull_request.merge_commit_sha）を、全履歴（fetch-depth: 0）で取得する
#        （マージ先の最新ではない。続けてマージされたとき、あとの PR の変更を、この PR のリリースに混ぜないため）
#     3. Node.js 22 を入れる
#     4. Salesforce CLI を入れる（npm install --global @salesforce/cli）
#     5. マージ先のブランチに対応する組織だけに、JWT でログインする（sf org login jwt・既定の組織に設定）:
#        main → *_PROD・エイリアス prod、staging → *_STG・エイリアス staging、develop → *_DEV・エイリアス develop。
#        秘密鍵は、Secret SF_PRIVATE_KEY を base64 -d で /tmp/server.key に戻し（umask 077）、ステップの終了時に必ず消す
#     6. sf-tools を、公開リポジトリ https://github.com/tama-create/sf-tools.git から、Variable SF_TOOLS_BRANCH のブランチ
#        （未設定なら main）で、~/sf-tools に clone する（Token は使わない）
#     6.5 一方通行の確認（doc/one-way-promotion-design.md。最後の守り）: PR の先端のコミット（head.sha）を、全履歴で force-promote-check に
#        取得し（名前は force- で始める。sf-tools のコマンドは force-* のフォルダでしか動かない）、そこで
#        sf-promote-check.sh --pr <PR 番号> を実行する（--only なし = R0〜R3 のすべて。GH_TOKEN は自動の GITHUB_TOKEN）。
#        破っている（1）・判断できない（2）ときは、ジョブを失敗にし、組織へは出さない（Ruleset が使えない組織で、
#        順序外の PR がマージされても、組織は変わらない）
#     7. sf-tools/release/branch_name.txt に、ソースブランチ名を書き、
#        sf-release.sh --release --no-open --target <prod / staging / develop> を実行する
#        （main → prod、staging → staging、develop → develop。GitHub Actions 上のため、確認は表示されない）
#     7.5 リリースが成功したら、PR の先端のコミットに、リリースの印（commit status。context sf-tools/released-<マージ先>・
#        state success・target_url この実行）を付ける。次の段階の PR の一方通行の確認（R1）が、この印を見る。付けられなければ、
#        5 秒・10 秒あけて 3 回まで試し、だめなら ::error を出してジョブを失敗にする（「Re-run jobs」でやり直す）
#     8. （常に。if: always()）Slack の chat.postMessage に、結果を送る。ジョブの状態（job.status）が success なら
#        「:white_check_mark: … リリース成功」、手順 6.5 で止めたときは「:no_entry: … リリースを止めました（一方通行の決まり…）」、
#        それ以外（失敗・取り消し）は「:x: … リリース失敗」。
#        リリース先・ブランチ・PR（PR のときだけ）・実行日時（日本時間）・Actions のログの URL を含む。
#        送信に失敗した（curl の失敗・応答の ok が true でない）ときは、::warning を出す（このステップは失敗にしない。
#        応答の JSON は、node で読む）
#   手順 1〜7.5 のどれかが失敗すると、以降の手順（8 を除く）は行わず、ジョブは失敗する。リリースの中身（マニフェストの生成・
#   テストクラスの指定・sf project deploy start）と終了コードは、sf-release.sh の冒頭コメントを参照
#
# 【必要な Secrets / Variables】
#   Secrets（このリポジトリに設定する。SF_PRIVATE_KEY は sf-init の Phase 10・sf-update-secret.sh が、SF_CONSUMER_KEY_* は
#   それに加えて sf-init.sh --add-tier（_STG・_DEV だけ）/ --reconnect も登録する。SLACK_BOT_TOKEN は Phase 7 が登録する）:
#     SF_PRIVATE_KEY       : JWT の秘密鍵（server.key の PEM を、1 行の Base64 にした値。全組織共通）
#     SF_CONSUMER_KEY_PROD : main の組織のアプリ（外部クライアントアプリケーション）のコンシューマー鍵
#     SF_CONSUMER_KEY_STG  : staging の組織のアプリのコンシューマー鍵
#     SF_CONSUMER_KEY_DEV  : develop の組織のアプリのコンシューマー鍵
#     SLACK_BOT_TOKEN      : Slack API の Bot Token（結果の通知に使用）
#   Variables（このリポジトリに設定する。SF_USERNAME_*・SF_INSTANCE_URL_* の登録元は、SF_CONSUMER_KEY_* と同じ。
#   SLACK_CHANNEL_ID は Phase 7 が登録する）:
#     SF_USERNAME_PROD     : main の組織の接続ユーザー名
#     SF_USERNAME_STG      : staging の組織の接続ユーザー名
#     SF_USERNAME_DEV      : develop の組織の接続ユーザー名
#     SF_INSTANCE_URL_PROD : main の組織の接続 URL（https://login.salesforce.com 等）
#     SF_INSTANCE_URL_STG  : staging の組織の接続 URL
#     SF_INSTANCE_URL_DEV  : develop の組織の接続 URL
#     SLACK_CHANNEL_ID     : 通知先 Slack チャンネル ID
#     SF_TOOLS_BRANCH      : clone する sf-tools のブランチ（任意。未設定なら main。Phase 9 は development のときだけ登録する）
#
# 【補足】
#   - ジョブ「リリース実行」がスキップされたとき（デプロイ対象がない・マージせずに閉じた）は、Slack に通知しない
#   - 同時実行の制御: 続けてマージしても、同じマージ先へのリリースは、並行せず、1 つずつ動く（待機中の実行は、取り消されない。
#     ただし、待機が 100 を超えると、GitHub の仕様で、それ以降の実行は取り消される）。マージ先が違うリリースは、並行して動く
# ==============================================================================
name: "[release] デプロイ"
on:
  pull_request:
    types: [closed]
    branches:
      - main
      - staging
      - develop
  # 手動の実行（workflow_dispatch）は、ない（PR を通らずに組織へ出せるため。doc/one-way-promotion-design.md 3.5）。
  #   失敗したリリースのやり直しは、その実行の「Re-run jobs」で行う（同じイベント・同じコミットのため、一方通行の確認も同じく通る）

jobs:
  check-branch:
    name: リリース対象確認
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - id: check
        name: デプロイ対象ファイルを確認
        env:
          # ブランチ名・PR のタイトルなど、利用者が決められる値は、シェルのスクリプトに直接埋め込まず、環境変数で受け取る
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          # リリース先（PR のマージ先）
          TARGET_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # >>> sf-tools: tier-switch v1（この印の間は、wf-release・wf-validate で同じ中身にする。--remove-tier・テストが比べる）
          # load_tiers: origin/main の branches.txt から、有効な段階を読む（# の行・空行を除く。CR・行の前後の空白を除く）
          #   main を取得できない → ::error を出して 1 を返す（呼び出し側で、ジョブを失敗にする。段階が分からないまま書き込まない）
          #   branches.txt がない → ::warning を出し、TIERS_KNOWN=0（tier_enabled は、今までの動きのため、常に有効を返す）
          #   main の取得は、浅いリポジトリ（checkout が既定の fetch-depth: 1）なら --depth=1 で軽く、全履歴なら --depth を付けない。
          #   全履歴のリポジトリを --depth=1 で取得すると、リポジトリが浅くなり、main の先の履歴が切れて、あとのマージ・祖先の確認が
          #   失敗するため（2026-11-22 に e2e で、当時の wf-propagate のマージが「refusing to merge unrelated histories」で失敗した）
          load_tiers() {
            if [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" = "true" ]; then _depth="--depth=1"; else _depth=""; fi
            git fetch origin main $_depth -q || { echo "::error title=段階を判定できません::main を取得できません。段階を判定できないため、止めます。"; return 1; }
            if TIERS_RAW=$(git show FETCH_HEAD:sf-tools/config/branches.txt 2>/dev/null); then
              TIERS=$(printf '%s\n' "$TIERS_RAW" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | grep -v '^#' | grep -v '^$' || true)
              TIERS_KNOWN=1
            else
              TIERS=""; TIERS_KNOWN=0
              echo "::warning title=段階の切り替え::main に sf-tools/config/branches.txt がありません。段階の切り替えを使わず、今までの動きにします。"
            fi
            for _t in $TIERS; do
              case "$_t" in main|staging|develop) ;; *) echo "::warning title=段階の切り替え::branches.txt の「${_t}」は、段階の名前ではないため、無視します。" ;; esac
            done
            return 0
          }
          # tier_enabled 段階: 有効なら 0。main は常に有効。develop は、staging も有効なときだけ有効
          tier_enabled() {
            [ "$1" = "main" ] && return 0
            [ "$TIERS_KNOWN" = 1 ] || return 0
            case "$1" in staging|develop) ;; *) return 1 ;; esac
            printf '%s\n' "$TIERS" | grep -qxF -- "$1" || return 1
            if [ "$1" = "develop" ]; then printf '%s\n' "$TIERS" | grep -qxF -- staging || return 1; fi
            return 0
          }
          # <<< sf-tools: tier-switch v1
          # 段階の判定（PR のマージは、必ずここを通る。doc/tier-scaling-design.md 3.3）。
          #   main は常に有効なので、判定しない（main を取得する通信の失敗で、main のリリースを止めないため）。
          #   main 以外で、段階として無効なら、skip=true（ジョブ「リリース実行」は動かない）。main を取得できなければ、このジョブを失敗にする
          if [[ "$TARGET_REF" != "main" ]]; then                                                    # sf-tools: tier-check
            load_tiers || exit 1                                                                     # sf-tools: tier-check
            if ! tier_enabled "$TARGET_REF"; then                                                    # sf-tools: tier-check
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "::notice title=リリースしません::${TARGET_REF} は branches.txt にない（develop は staging もないときを含む）ため、段階として無効です。リリースしません。"
              exit 0
            fi
          fi
          HEAD="$HEAD_REF"
          DEPLOY="sf-tools/release/${HEAD}/deploy-target.txt"
          REMOVE="sf-tools/release/${HEAD}/remove-target.txt"
          has_content() {
            [[ -f "$1" ]] && grep -qvE '^\s*(#|$|\[files\]|\[members\])' "$1"
          }
          if ! has_content "$DEPLOY" && ! has_content "$REMOVE"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "デプロイ対象なし（${DEPLOY} / ${REMOVE} に内容なし）のためスキップします。"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: リリース実行
    needs: check-branch
    # PR がマージされたときだけ、リリースする
    if: github.event.pull_request.merged == true && needs.check-branch.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # 一方通行の確認（PR・コミットの状態・Actions の実行を読む）と、リリースの印（commit status）を付けるための権限
    permissions:
      contents: read
      pull-requests: read
      statuses: write
      actions: read
    # 同じ組織（マージ先のブランチ）へのリリースは、1 つずつ動かす（並行させない。待機の順は、原則、先に起動したものから。
    #   GitHub の仕様で、順序は保証されない）。
    #   queue: max で、待機中の実行を置き換えずに、すべて残す（既定の queue: single では、待機中の実行が、より新しい実行に
    #   置き換えられて取り消され、そのマージのリリースが、行われないまま終わるため。各実行は、自分のソースブランチの
    #   リストだけをリリースする）。実行中のものは取り消さない
    concurrency:
      group: release-${{ github.event.pull_request.base.ref }}
      cancel-in-progress: false
      queue: max

    steps:
      # --------------------------------------------------------------------------
      # Step 1: リリース先情報をログ・GitHub Actions Summary に記録
      # --------------------------------------------------------------------------
      - name: リリース先を確認
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_TITLE_RAW: ${{ github.event.pull_request.title || '' }}
          PR_NUMBER_RAW: ${{ github.event.pull_request.number || '' }}
        run: |
          BRANCH="$BASE_REF"
          if [ "$BRANCH" = "main" ]; then
            ENV_LABEL="🚀 main の組織 (prod)"
          elif [ "$BRANCH" = "staging" ]; then
            ENV_LABEL="🧪 staging の組織 (staging)"
          else
            ENV_LABEL="🔧 develop の組織 (develop)"
          fi
          PR_TITLE="$PR_TITLE_RAW"
          PR_NUMBER="$PR_NUMBER_RAW"

          echo "::notice title=リリース先::${ENV_LABEL} | ブランチ: ${BRANCH}"

          echo "## 🎯 Salesforce Release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 項目 | 値 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| リリース先 | ${ENV_LABEL} |" >> $GITHUB_STEP_SUMMARY
          echo "| ブランチ | \`${BRANCH}\` |" >> $GITHUB_STEP_SUMMARY
          if [ -n "$PR_NUMBER" ]; then
            echo "| PR | #${PR_NUMBER} ${PR_TITLE} |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| 実行日時 | $(TZ='Asia/Tokyo' date '+%Y-%m-%d %H:%M:%S JST') |" >> $GITHUB_STEP_SUMMARY

      # --------------------------------------------------------------------------
      # Step 2: この PR のマージのコミット（merge_commit_sha）をチェックアウト
      #   マージ先ブランチの最新（base.ref）ではなく、この PR のマージのコミットに固定する。続けてマージされたとき、
      #   あとの PR の変更（同じファイルの別の版）を、この PR のリリースに混ぜないため（一方通行: 確かめたものと同じものを出す）
      # --------------------------------------------------------------------------
      - name: ソースコードを取得
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      # --------------------------------------------------------------------------
      # Step 3: Node.js のセットアップ
      # --------------------------------------------------------------------------
      - name: Node.js をインストール
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          # package.json の packageManager による自動キャッシュは使わない（v5 以降の既定。sf は npm install -g で入れるため不要。利用者の package.json で動きが変わらないようにする）
          package-manager-cache: false

      # --------------------------------------------------------------------------
      # Step 4: Salesforce CLI のインストール
      # --------------------------------------------------------------------------
      - name: Salesforce CLI をインストール
        run: npm install --global @salesforce/cli

      # --------------------------------------------------------------------------
      # Step 5: マージ先ブランチに対応する Salesforce 組織への認証（main / staging / develop のどれか 1 つだけが動く。
      #   ジョブの if: で、マージ先は、この 3 つのどれかに限られる）
      # --------------------------------------------------------------------------
      - name: main の組織にログイン（JWT）
        if: ${{ (github.event.pull_request.base.ref) == 'main' }}
        run: |
          # 秘密鍵は、本人だけが読める権限で作り、ログインの成否にかかわらず（失敗しても）、必ず消す
          umask 077
          trap 'rm -f /tmp/server.key' EXIT
          echo "${{ secrets.SF_PRIVATE_KEY }}" | base64 -d > /tmp/server.key
          sf org login jwt \
            --client-id    "${{ secrets.SF_CONSUMER_KEY_PROD }}" \
            --jwt-key-file /tmp/server.key \
            --username     "${{ vars.SF_USERNAME_PROD }}" \
            --instance-url "${{ vars.SF_INSTANCE_URL_PROD }}" \
            --set-default --alias prod
          rm -f /tmp/server.key

      - name: staging の組織にログイン（JWT）
        if: ${{ (github.event.pull_request.base.ref) == 'staging' }}
        run: |
          # 秘密鍵は、本人だけが読める権限で作り、ログインの成否にかかわらず（失敗しても）、必ず消す
          umask 077
          trap 'rm -f /tmp/server.key' EXIT
          echo "${{ secrets.SF_PRIVATE_KEY }}" | base64 -d > /tmp/server.key
          sf org login jwt \
            --client-id    "${{ secrets.SF_CONSUMER_KEY_STG }}" \
            --jwt-key-file /tmp/server.key \
            --username     "${{ vars.SF_USERNAME_STG }}" \
            --instance-url "${{ vars.SF_INSTANCE_URL_STG }}" \
            --set-default --alias staging
          rm -f /tmp/server.key

      - name: develop の組織にログイン（JWT）
        if: ${{ (github.event.pull_request.base.ref) == 'develop' }}
        run: |
          # 秘密鍵は、本人だけが読める権限で作り、ログインの成否にかかわらず（失敗しても）、必ず消す
          umask 077
          trap 'rm -f /tmp/server.key' EXIT
          echo "${{ secrets.SF_PRIVATE_KEY }}" | base64 -d > /tmp/server.key
          sf org login jwt \
            --client-id    "${{ secrets.SF_CONSUMER_KEY_DEV }}" \
            --jwt-key-file /tmp/server.key \
            --username     "${{ vars.SF_USERNAME_DEV }}" \
            --instance-url "${{ vars.SF_INSTANCE_URL_DEV }}" \
            --set-default --alias develop
          rm -f /tmp/server.key

      # --------------------------------------------------------------------------
      # Step 6: sf-tools のクローン（公開リポジトリ。Token なし。Variable SF_TOOLS_BRANCH のブランチ、未設定なら main）
      # --------------------------------------------------------------------------
      - name: 自動化ツール（sf-tools）を取得
        run: git clone -b ${{ vars.SF_TOOLS_BRANCH || 'main' }} https://github.com/tama-create/sf-tools.git ~/sf-tools

      # --------------------------------------------------------------------------
      # Step 6.5: 一方通行の確認（doc/one-way-promotion-design.md。最後の守り）
      #   PR の先端のコミット（head.sha）を、別のフォルダ（force-promote-check。名前は force- で始める）に取得し、
      #   sf-promote-check.sh --pr で、R0〜R3 をすべて確かめる（--only は付けない）。破っていれば、ここでジョブを失敗にし、
      #   組織へは出さない（Ruleset が使えない組織で、順序外の PR がマージされても、組織は変わらない）
      # --------------------------------------------------------------------------
      - name: 一方通行の確認用に、PR の先端のコミットを取得
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: force-promote-check
          fetch-depth: 0

      - name: 一方通行の確認（順序・積み重ね・環境ブランチ）
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          cd force-promote-check
          bash ~/sf-tools/bin/sf-promote-check.sh --pr "$PR_NUMBER"

      # --------------------------------------------------------------------------
      # Step 7: Salesforce へのリリース実行（main → prod、staging → staging、develop → develop の組織。
      #   sf-tools/release/branch_name.txt に、ソースブランチ名を書いてから、sf-release.sh --release を実行する。失敗はジョブの失敗）
      # --------------------------------------------------------------------------
      - name: Salesforce にリリースを実行
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          BRANCH="$BASE_REF"
          if [ "$BRANCH" = "main" ]; then
            TARGET="prod"
          elif [ "$BRANCH" = "staging" ]; then
            TARGET="staging"
          else
            TARGET="develop"
          fi
          SOURCE="$SOURCE_BRANCH"
          mkdir -p sf-tools/release
          printf '%s\n' "$SOURCE" > sf-tools/release/branch_name.txt
          chmod +x ~/sf-tools/bin/sf-release.sh
          ~/sf-tools/bin/sf-release.sh --release --no-open --target "$TARGET"

      # --------------------------------------------------------------------------
      # Step 7.5: リリースの印（commit status）を、PR の先端のコミットに付ける（リリースが成功したときだけ。
      #   次の段階の PR の一方通行の確認（R1）が、この印を見る。doc/one-way-promotion-design.md 3.1）。
      #   context: sf-tools/released-<段階>。target_url: この実行。付けられなければ 3 回まで試し、だめならジョブを失敗にする
      #   （組織には出ているが印がない状態。次の段階が R1 で止まる側に倒れる。やり直しは「Re-run jobs」）
      # --------------------------------------------------------------------------
      - name: リリースの印を付ける
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          RUN_URL="https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}"
          DESC="PR #${PR_NUMBER} を ${BASE_REF} の組織にリリースしました（$(TZ='Asia/Tokyo' date '+%Y-%m-%d %H:%M JST')）"
          for i in 1 2 3; do
            if gh api -X POST "repos/${REPOSITORY}/statuses/${HEAD_SHA}" \
                -f state=success -f "context=sf-tools/released-${BASE_REF}" \
                -f "target_url=${RUN_URL}" -f "description=${DESC}" >/dev/null; then
              echo "::notice title=リリースの印::${HEAD_SHA:0:7} に sf-tools/released-${BASE_REF} を付けました。"
              exit 0
            fi
            sleep $((i * 5))
          done
          echo "::error title=リリースの印を付けられません::組織へのリリースは成功しましたが、${HEAD_SHA:0:7} に sf-tools/released-${BASE_REF} を付けられませんでした。この実行を「Re-run jobs」でやり直してください。"
          exit 1

      # --------------------------------------------------------------------------
      # Step 8: Slack への結果通知（前のステップが失敗しても実行する。ジョブの状態 job.status で、成功・失敗を書き分ける。
      #   送信の失敗は ::warning にし、このステップは失敗にしない）
      # --------------------------------------------------------------------------
      - name: Slack に結果を通知
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          # ブランチ名・PR のタイトルは、シェルのスクリプトに直接埋め込まず、環境変数で受け取る
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_TITLE_RAW: ${{ github.event.pull_request.title || '' }}
          PR_NUMBER_RAW: ${{ github.event.pull_request.number || '' }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          PROMOTE_OUTCOME: ${{ steps.promote.outcome }}
        run: |
          # Slack に送る JSON の文字列として安全にする（" と \ のエスケープ・制御文字の除去・Slack の特殊文字 & < > の置き換え）
          json_escape() { printf '%s' "$1" | tr -d '\000-\037' | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
          BRANCH="$BASE_REF"
          if [ "$BRANCH" = "main" ]; then
            ENV_LABEL="🚀 main の組織 (prod)"
          elif [ "$BRANCH" = "staging" ]; then
            ENV_LABEL="🧪 staging の組織 (staging)"
          else
            ENV_LABEL="🔧 develop の組織 (develop)"
          fi
          BRANCH=$(json_escape "$BRANCH")

          PR_TITLE=$(json_escape "$PR_TITLE_RAW")
          PR_NUMBER=$(json_escape "$PR_NUMBER_RAW")
          RUN_URL="https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}"
          DATETIME=$(TZ='Asia/Tokyo' date '+%Y-%m-%d %H:%M:%S JST')

          if [ "$JOB_STATUS" = "success" ]; then
            ICON=":white_check_mark:"
            STATUS_TEXT="リリース成功"
          elif [ "$PROMOTE_OUTCOME" = "failure" ]; then
            # 一方通行の確認で止めた（組織は変わっていない。理由は Actions のログ）
            ICON=":no_entry:"
            STATUS_TEXT="リリースを止めました（一方通行の決まり: 前の段階に出していない・積み重ねの抜け・環境ブランチなど。組織は変わっていません）"
          else
            ICON=":x:"
            STATUS_TEXT="リリース失敗"
          fi

          PR_TEXT=""
          if [ -n "$PR_NUMBER" ]; then
            PR_TEXT="\n• PR: #${PR_NUMBER} ${PR_TITLE}"
          fi

          MESSAGE="${ICON} *Salesforce Release ${STATUS_TEXT}*\n• リリース先: ${ENV_LABEL}\n• ブランチ: \`${BRANCH}\`${PR_TEXT}\n• 実行日時: ${DATETIME}\n• <${RUN_URL}|Actions ログを見る>"
          CHANNEL=$(json_escape "$SLACK_CHANNEL_ID")   # Variable の値も、JSON の文字列として安全にする
          PAYLOAD="{\"channel\": \"${CHANNEL}\", \"text\": \"${MESSAGE}\"}"

          # 送信の失敗（curl の失敗・応答の ok が true でない（Token の誤り・Bot がチャンネルにいないなど））は、::warning を出すだけで、
          #   このステップは失敗にしない（リリースの成否を、通知の失敗で変えないため）。応答の JSON は、Node で読む
          RESPONSE=$(curl -sS -X POST "https://slack.com/api/chat.postMessage" \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || true)   # 意図的なエラー無視（下で応答を確かめ、::warning にする）
          echo "Slack の応答: $RESPONSE"
          if ! node -e 'process.exit(JSON.parse(process.argv[1]).ok === true ? 0 : 1)' "$RESPONSE" 2>/dev/null; then
            echo "::warning title=Slack 通知の失敗::Slack への通知が、失敗しました（応答の ok が true ではありません）。Secret SLACK_BOT_TOKEN・Variable SLACK_CHANNEL_ID を確認してください。"
          fi
