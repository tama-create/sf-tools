name: テスト

# sf-tools 自体のテスト（モックベースの単体テスト 約 1,600 件）と、シェルの静的解析（shellcheck）。
# 実際の GitHub / Salesforce には触れない（Secrets は使わない）。実環境の確認は tests/e2e（開発者が手動で実行する）。
# shellcheck の設定（無効にしている項目と、その理由）は、リポジトリの .shellcheckrc。
on:
  pull_request:
    branches: [main, development]
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 全件テスト
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v4

      - name: テストを実行
        run: bash tests/run_tests.sh

  shellcheck:
    name: shellcheck（警告以上）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v4

      - name: Python を用意
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # バージョンを固定する（手元と同じ結果にするため）。設定は、リポジトリの .shellcheckrc
      - name: shellcheck を導入
        run: pip install shellcheck-py==0.11.0.1

      - name: shellcheck を実行（警告以上）
        run: |
          shellcheck --version
          files=$(git ls-files 'bin/*.sh' 'lib/*.sh' 'phases/*.sh' 'hooks/*' 'templates/*.sh')
          shellcheck -S warning $files

  # --------------------------------------------------------------------------
  # クロスプラットフォーム（macOS・Windows）。sf-tools は、Windows（Git Bash）・macOS・Linux で、同じように動くことが前提。
  # 導入の初期は、結果の表示のみ（continue-on-error: true）。失敗の一覧が、そのまま、対応の作業リストになる。
  # 指摘をなくしたあと、この行を消して、失敗扱いにする。
  # --------------------------------------------------------------------------
  test-macos:
    name: 全件テスト（macOS）
    runs-on: macos-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v4

      # macOS 標準の Bash は 3.2。sf-tools は Bash 4.3 以上が前提のため、brew で入れて、PATH の先頭に置く。
      # sed などの標準コマンドは、BSD 版のまま使う（GNU 版は、入れない: BSD で動かない書き方を、見逃さないため）
      - name: Bash 4.3 以上を用意
        run: |
          brew install bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: テストを実行
        run: |
          bash --version | head -1
          sed --version 2>&1 | head -1 || true
          bash tests/run_tests.sh

  test-windows:
    name: 全件テスト（Windows・Git Bash）
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    defaults:
      run:
        shell: bash
    env:
      # Git Bash のまま実行する（run_tests.sh は、WSL を使えるとき、WSL に移るが、ランナーには WSL のディストリビューションがない）
      SF_TEST_NO_WSL: "1"
    steps:
      # Windows では、チェックアウト時に、改行が CRLF に変換されることがある。シェルスクリプトは LF のままにする
      - name: 改行の自動変換を止める
        run: git config --global core.autocrlf false

      - name: ソースコードを取得
        uses: actions/checkout@v4

      - name: テストを実行
        run: |
          bash --version | head -1
          bash tests/run_tests.sh
