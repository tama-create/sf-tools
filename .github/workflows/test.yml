name: テスト

# sf-tools 自体のテスト（モックベースの単体テスト。件数は変わるため、書かない）と、シェルの静的解析（shellcheck）。
# 実際の GitHub / Salesforce には触れない（Secrets は使わない）。実環境の確認は tests/e2e（配布物が変わった development への push で、e2e.yml が自動で動かす。手元では、新しい環境の確認・調査のときだけ）。
# shellcheck の設定（無効にしている項目と、その理由）は、リポジトリの .shellcheckrc。
on:
  pull_request:
    branches: [main, development]
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 全件テスト
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 結合テスト（test_integration.sh）は、別のジョブ（下の integration）で動かす
      SF_TEST_SKIP_INTEGRATION: "1"
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v4

      - name: テストを実行
        run: bash tests/run_tests.sh

  shellcheck:
    name: shellcheck（警告以上）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v4

      - name: Python を用意
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # バージョンを固定する（手元と同じ結果にするため）。設定は、リポジトリの .shellcheckrc
      - name: shellcheck を導入
        run: pip install shellcheck-py==0.11.0.1

      - name: shellcheck を実行（警告以上）
        run: |
          shellcheck --version
          files=$(git ls-files 'bin/*.sh' 'lib/*.sh' 'phases/*.sh' 'hooks/*' 'templates/*.sh')
          shellcheck -S warning $files

  # --------------------------------------------------------------------------
  # クロスプラットフォーム（macOS・Windows）。sf-tools は、Windows（Git Bash）・macOS・Linux で、同じように動くことが前提。
  # 2026-10-14: macOS・Windows とも、全件が成功するようになったため、失敗扱いにした（continue-on-error を外した）。
  # 以前は、導入の初期として、結果の表示のみ（continue-on-error: true）にしていた。
  # --------------------------------------------------------------------------
  # macOS も、全件を 2 つのジョブに分けて、並列に動かす（tests/run_tests.sh --shard I/N。Windows と同じ分け方）。2026-10-28 の実測:
  # 1 つのジョブで約 8 分 → 2 つで約 4〜5 分。分けたジョブの名前（全件テスト（macOS 1/2））は、必須チェックにしない。
  # 必須チェックの名前「全件テスト（macOS）」は、下の集約のジョブ（test-macos）が受け持つ（Ruleset の必須チェックの名前を変えずに、分けるため）。
  test-macos-shard:
    name: 全件テスト（macOS ${{ matrix.shard }}/${{ strategy.job-total }}）
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      SF_TEST_SKIP_INTEGRATION: "1"   # 結合テストは、別のジョブ（integration）で動かす
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v4

      # macOS 標準の Bash（/bin/bash = 3.2）のまま実行する。sf-tools は、追加のインストールなしで、macOS で動くことが前提
      # （Bash 4 以降の機能を使うと、ここで失敗する）。sed などの標準コマンドも、BSD 版のまま使う（GNU 版は、入れない）
      - name: テストを実行（macOS 標準の Bash 3.2。組 ${{ matrix.shard }}/${{ strategy.job-total }}）
        run: |
          /bin/bash --version | head -1
          sed --version 2>&1 | head -1 || true
          /bin/bash tests/run_tests.sh --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  # 集約: macOS の組が、すべて成功したときだけ成功する（必須チェック「全件テスト（macOS）」）。組が失敗・取り消し・スキップのときは失敗にする
  test-macos:
    name: 全件テスト（macOS）
    runs-on: ubuntu-latest
    needs: test-macos-shard
    if: ${{ always() }}
    timeout-minutes: 5
    steps:
      - name: macOS の組の結果を確認
        env:
          SHARDS_RESULT: ${{ needs.test-macos-shard.result }}
        run: |
          echo "macOS の組の結果: ${SHARDS_RESULT}"
          [ "${SHARDS_RESULT}" = "success" ]

  # Windows（Git Bash）は、テストの 1 つ 1 つが、プロセスの起動が多く、遅い（2026-10-20 の実測: 全件が約 21 分、結合テスト L1 が約 10 分）。
  # そこで、全件（結合テスト L1 を含む）を、6 つのジョブに分けて、並列に動かす（tests/run_tests.sh --shard I/N。重いファイルから、
  # いちばん軽い組へ、順に割り当てる）。6 組を全部動かすと、全ファイルが、ちょうど 1 回ずつ動く（tests/test_run-tests.sh が確認）。
  # 組の数は、matrix.shard の数で決まる（strategy.job-total）。増減しても、分け方は、自動で追従する。
  test-windows:
    name: 全件テスト（Windows・Git Bash ${{ matrix.shard }}/${{ strategy.job-total }}）
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        shell: bash
    env:
      # Git Bash のまま実行する（run_tests.sh は、WSL を使えるとき、WSL に移るが、ランナーには WSL のディストリビューションがない）
      SF_TEST_NO_WSL: "1"
      # 起動するテストファイルを順に表示する（異常終了したとき、どのファイルで止まったかを分かるようにする）
      SF_TEST_PROGRESS: "1"
      # 各ファイルの所要時間を、最後に表示する（分け方の目安 _weight を、実測で直すため）
      SF_TEST_TIMES: "1"
    steps:
      # Windows では、チェックアウト時に、改行が CRLF に変換されることがある。シェルスクリプトは LF のままにする
      - name: 改行の自動変換を止める
        run: git config --global core.autocrlf false

      - name: ソースコードを取得
        uses: actions/checkout@v4

      # 並列（既定は CPU の数）で実行する。以前は、終了コード 2304 で異常終了していたが、原因は、並列ではなく、
      # テストが本物の `git update-git-for-windows`（Git の更新）を実行し、Git Bash 自体を壊していたことだった
      # （tests/run_tests.sh の保護用の代理コマンドで解消）。再び異常終了するときは、--serial に戻す
      # （SF_TEST_PROGRESS の [START] 行で、止まったファイルが分かる）
      - name: テストを実行（組 ${{ matrix.shard }}/${{ strategy.job-total }}）
        run: |
          bash --version | head -1
          bash tests/run_tests.sh --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  # --------------------------------------------------------------------------
  # 結合テスト L1（ローカル結合）: 実際の git ＋ ローカルの bare リポジトリ ＋ gh・sf・npm の fake で、
  # 複数のコマンドを連動させる（tests/test_integration.sh。計画: doc/integration-test-plan.md）。
  # 全件テストとは別のジョブにして、並行して動かす（2026-10-19 の実測: Ubuntu 約 40 秒・macOS 約 1 分）。
  # Windows の結合テストは、重いため、上の test-windows の組（--shard）に含めて、並列に動かす。
  # --------------------------------------------------------------------------
  integration:
    name: 結合テスト L1（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v4

      # 結合テストのファイル（tests/test_integration*.sh。表のガード test_integration-coverage.sh は、全件テストで動くため除く）を、
      # run_tests.sh で、並列に実行する。macOS は、標準の Bash 3.2（/bin/bash）のまま実行する。Windows は Git Bash（WSL には移らない）
      - name: 結合テストを実行
        run: /bin/bash tests/run_tests.sh $(cd tests && ls test_integration*.sh | grep -v coverage)
